services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: python -m app.workers.whatsapp_worker

  ai_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: python -m app.workers.ai_parse_worker

  notification_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
    command: python -m app.workers.notification_worker

  outbound_webhook_worker:
    build: .
    env_file:
      - .env
    depends_on:
      - db
    volumes:
      - .:/app
    command: python -m app.workers.outbound_webhook_worker

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskam
      POSTGRES_PASSWORD: taskam
      POSTGRES_DB: taskam
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
