name: integration-contracts

on:
  push:
  pull_request:

jobs:
  postgres-migrations-and-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskam
          POSTGRES_PASSWORD: taskam
          POSTGRES_DB: taskam
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskam -d taskam"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://taskam:taskam@127.0.0.1:5432/taskam
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply migrations to PostgreSQL
        run: |
          alembic upgrade head
          test "$(alembic current | awk '{print $1}')" = "b1d4e6f8a2c3"
      - name: Run contract and application tests
        run: pytest -q
